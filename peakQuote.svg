<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 320">

    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a1b27"/>
            <stop offset="100%" stop-color="#24283b"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        width="1000"
        height="320"
        rx="20"
        fill="url(#bg)" />

    <!-- Accent -->
    <rect
        x="35"
        y="40"
        width="8"
        height="220"
        rx="4"
        fill="#7aa2f7" />

    <!-- Opening quote -->
    <text
        x="65"
        y="95"
        fill="#7aa2f7"
        font-size="72"
        font-family="Georgia, serif">
        “
    </text>

    <!-- Closing quote -->
    <text
        x="885"
        y="225"
        fill="#7aa2f7"
        font-size="72"
        font-family="Georgia, serif">
        ”
    </text>

    <!-- Quote -->
    <text
        fill="#c0caf5"
        font-size="30"
        font-family="Arial, sans-serif">

        <tspan x="120" y="90">
            Non sông Việt Nam có trở nên tươi đẹp hay không,
        </tspan>

        <tspan x="120" y="130">
            dân tộc Việt Nam có bước tới đài vinh quang để sánh vai
        </tspan>

        <tspan x="120" y="170">
            với các cường quốc năm châu được hay không,
        </tspan>

        <tspan x="120" y="210">
            chính là nhờ một phần lớn ở công học tập của các em.
        </tspan>

    </text>

    <!-- Signature line -->
    <!-- <line
        x1="650"
        y1="255"
        x2="920"
        y2="255"
        stroke="#7aa2f7"
        stroke-width="2" /> -->

    <!-- Author -->
    <text
        x="920"
        y="290"
        text-anchor="end"
        fill="#9aa5ce"
        font-size="25"
        font-style="italic"
        font-family="Arial, sans-serif">
        — Chủ tịch Hồ Chí Minh
    </text>

</svg>
