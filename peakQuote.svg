<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300">

    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a1b27"/>
            <stop offset="100%" stop-color="#24283b"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        x="0"
        y="0"
        width="1000"
        height="300"
        rx="20"
        fill="url(#bg)"/>

    <!-- Accent bar -->
    <rect
        x="35"
        y="45"
        width="8"
        height="190"
        rx="4"
        fill="#7aa2f7"/>

    <!-- Opening quote -->
    <text
        x="65"
        y="85"
        fill="#7aa2f7"
        font-size="60"
        font-family="Arial">
        “
    </text>

    <!-- Quote text -->
    <text
        fill="#c0caf5"
        font-size="24"
        font-family="Arial">

        <tspan x="100" y="85">
            Non sông Việt Nam có trở nên tươi đẹp hay không,
        </tspan>

        <tspan x="100" y="125">
            dân tộc Việt Nam có bước tới đài vinh quang để sánh vai
        </tspan>

        <tspan x="100" y="165">
            với các cường quốc năm châu được hay không,
        </tspan>

        <tspan x="100" y="205">
            chính là nhờ một phần lớn ở công học tập của các em.”
        </tspan>

    </text>

    <!-- Author -->
    <text
        x="930"
        y="270"
        text-anchor="end"
        fill="#9aa5ce"
        font-size="20"
        font-family="Arial">
        — Chủ tịch Hồ Chí Minh
    </text>

</svg>
